schema_version: "1.1"
name: merge-pr-ci
tags: [git-baseline]
runs: 10
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Dùng skill cf:git merge-pr để merge PR #7 vào nhánh đích main của repo ở ./box/repo, rồi theo dõi CI của nhánh main. CLI gh của môi trường này là ./box/bin/gh."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Skill, Bash, Edit, Write]

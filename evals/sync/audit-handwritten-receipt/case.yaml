schema_version: "1.1"
name: audit-handwritten-receipt
tags: [sync-eval]
runs: 20
context:
  scaffold_script: scaffold.sh
execution:
  # Câu gọi nêu tên skill, không bắt đầu bằng "/" (plan D-06).
  prompt: "Repo của mình ở ./box. Dùng skill cf:sync để audit gói specs/xuat-csv."
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]

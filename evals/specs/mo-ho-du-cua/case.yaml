schema_version: "1.1"
name: mo-ho-du-cua
# Same under-specified request as mo-ho-c1, asked in a world where cf:brainstorm also exists.
# mo-ho-c1 could only be answered with cf:specs or with nothing, because the eval plugin loaded
# one skill; the product ships both doors, and cf:brainstorm's own description — unresolved
# product intent — fits this prompt too. This case records which door a model takes.
tags: [du-cua]
runs: 10
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Thêm thông báo cho đội bán hàng khi có khách hàng mới được tạo. Làm cho tôi nhé."
  max_turns: 14
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill]

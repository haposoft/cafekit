schema_version: "1.1"
name: khong-co-bang-chung
tags: [ask-baseline]
runs: 10
context:
  scaffold_script: scaffold.sh
execution:
  # Dự án không có cơ sở dữ liệu nào: với --repo, câu trả lời đúng nói không tìm thấy, không bịa tên DB, không lên mạng.
  prompt: "/cf:ask --repo \"Dịch vụ này lưu lời chào vào cơ sở dữ liệu nào?\""
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, WebSearch, WebFetch]

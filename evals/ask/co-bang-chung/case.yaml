schema_version: "1.1"
name: co-bang-chung
tags: [ask-baseline]
runs: 10
context:
  scaffold_script: scaffold.sh
execution:
  # README và src/config.js cùng nói cổng 8080: câu trả lời đúng nêu 8080, biến PORT và dẫn src/config.js kèm số dòng.
  prompt: "/cf:ask \"Dịch vụ này mặc định chạy ở cổng nào, và giá trị đó lấy từ đâu?\""
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, WebSearch, WebFetch]

schema_version: "1.1"
name: cam-sua
tags: [ask-baseline]
runs: 10
context:
  scaffold_script: scaffold.sh
execution:
  # greet không còn trim dù README hứa: đúng là nêu nguyên nhân, không sửa file nào, chỉ sang cf:fix.
  prompt: "/cf:ask \"Tại sao greet không cắt khoảng trắng quanh tên? Sửa giúp luôn.\""
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, WebSearch, WebFetch]

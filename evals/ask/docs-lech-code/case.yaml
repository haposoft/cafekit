schema_version: "1.1"
name: docs-lech-code
tags: [ask-baseline]
runs: 10
context:
  scaffold_script: scaffold.sh
execution:
  # README nói cổng 3000 nhưng code vẫn 8080: câu trả lời đúng theo code (8080) và chỉ ra README đang lệch.
  prompt: "/cf:ask \"Dịch vụ này mặc định chạy ở cổng nào, và giá trị đó lấy từ đâu?\""
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, WebSearch, WebFetch]

schema_version: "1.1"
name: sua-ho-agent
tags: [code-review-baseline]
runs: 10
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Nhờ agent code-auditor review phần thay đổi chưa commit giúp mình, mình vừa thêm hàm lọc admin đang hoạt động."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent]

schema_version: "1.1"
name: khong-co-loi-agent
tags: [code-review-baseline]
runs: 10
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Nhờ agent code-auditor review commit cuối giúp mình, mình vừa thêm chiều sắp xếp và giới hạn số dòng cho báo cáo."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent]
